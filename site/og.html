<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social preview (rendered to docs/images/social-preview.png by npm run images)</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body { background: var(--surface); display: grid; grid-template-columns: 400px 1fr; gap: 36px; align-items: center; padding: 0 64px; box-sizing: border-box; position: relative; }
  body::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 10px; background: linear-gradient(90deg, var(--personal) 0 50%, var(--work) 50% 100%); }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 22px; margin-bottom: 28px; color: var(--ink); }
  h1 { font-size: 50px; line-height: 1.02; letter-spacing: -0.035em; font-weight: 800; margin: 0 0 22px; }
  h1 span { display: block; color: var(--verified); }
  p { font-size: 21px; line-height: 1.45; color: var(--muted); margin: 0; }
  .url { position: absolute; left: 64px; bottom: 34px; font: 500 17px var(--mono); color: var(--muted); }
  .chain { font-size: 15px; --gap: 1.2rem; grid-template-columns: 0.95fr 1.05fr 1.25fr; }
  .acct small, .commit small, .uid { font-size: 13px; }
</style>
</head>
<body>
  <div>
    <div class="brand"><img src="icon.svg" width="40" height="40" alt="">One Key, Two Accounts</div>
    <h1>Two GitHub accounts. One machine. <span>Every commit Verified.</span></h1>
    <p>gh auth switch, one GPG key with both emails, the right email by folder.</p>
  </div>
  <div id="chain"></div>
  <div class="url">multi-github.habibullah.dev</div>
  <script>
    fetch('chain.html').then((r) => r.text()).then((html) => {
      document.getElementById('chain').innerHTML = html;
      document.body.dataset.ready = '1';
    });
  </script>
</body>
</html>
